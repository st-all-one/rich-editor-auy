name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p rich-editor-auy --locked --test a11y
      - run: cargo test -p rich-editor-auy --features visits --locked --test visits
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: ./scripts/check_file_length.sh
      - run: python3 scripts/check_links.py
      - run: ./scripts/check_zero_style.sh
      - run: cargo package -p rich-editor-auy --locked --allow-dirty
      - run: cargo package -p rich-editor-auy-macros --locked --allow-dirty

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
      - uses: Swatinem/rust-cache@v2
      - run: RUSTUP_TOOLCHAIN=1.92 cargo build --workspace --locked
      - run: RUSTUP_TOOLCHAIN=1.92 cargo test --workspace --lib --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny cargo-machete cargo-audit --locked
      - run: cargo deny check
      - run: cargo machete
      - run: cargo audit

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: cargo miri test -p rich-editor-auy --test miri_smoke

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo install b3sum --version 1.8.2 --locked
      - run: AUY_REQUIRE_WASM_OPT=1 ./scripts/build_wasm.sh
      - run: test -s packages/ts/packages/core/wasm/rich_editor_auy_wasm_bg.wasm
      - run: test -s packages/ts/packages/core/wasm/rich_editor_auy_wasm_bg.wasm.blake3

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: cd packages/ts && deno task check && deno task publish:dry
      - run: deno check examples/ts/main.ts

  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: ${{ matrix.php == '8.2' && 'pcov' || 'none' }}
      - run: cd packages/php && composer install --no-interaction --prefer-dist --no-progress
      - run: cd packages/php && composer check
      - if: matrix.php == '8.2'
        run: cd packages/php && composer audit
      - if: matrix.php == '8.2'
        run: cd packages/php && composer coverage
      - if: matrix.php == '8.2'
        run: cd packages/php && composer smoke

  php-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C packages/php check-alpine

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind@0.16.1
      - uses: actions/cache/restore@v4
        with:
          path: bench/target/iai
          key: iai-${{ hashFiles('bench/Cargo.lock', 'bench/benches/iai_hot.rs', 'bench/src/lib.rs') }}
          restore-keys: iai-
      - name: criterion scenarios
        run: cd bench && cargo bench --bench hot --bench wire
      - name: instruction gate
        run: |
          cd bench
          if [ -f target/iai/main.json ]; then
            cargo bench --bench iai_hot -- --baseline=main
          else
            cargo bench --bench iai_hot -- --save-baseline=main
          fi
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: bench/target/iai
          key: iai-${{ hashFiles('bench/Cargo.lock', 'bench/benches/iai_hot.rs', 'bench/src/lib.rs') }}

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cd fuzz && cargo +nightly fuzz run --fuzz-dir . json_parse -- -max_total_time=60
      - run: cd fuzz && cargo +nightly fuzz run --fuzz-dir . a11y_tree -- -max_total_time=60
      - run: cd fuzz && cargo +nightly fuzz run --fuzz-dir . apply_step -- -max_total_time=60
      - run: cd fuzz && cargo +nightly fuzz run --fuzz-dir . round_trip -- -max_total_time=60
      - run: cd fuzz && cargo +nightly fuzz run --fuzz-dir . fragment -- -max_total_time=60
