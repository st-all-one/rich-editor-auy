[package]
name = "rich-editor-auy-bench"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
rich-editor-auy = { path = "../crates/rich-editor-auy", features = ["migration"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
iai-callgrind = "=0.16.1"
serde_json = "1"

[[bench]]
name = "hot"
harness = false

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "iai_hot"
harness = false
