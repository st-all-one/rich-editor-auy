[workspace]
resolver = "3"
members = [
    "crates/rich-editor-auy",
    "crates/rich-editor-auy-macros",
    "crates/rich-editor-auy-wasm",
    "crates/rich-editor-auy-testkit",
    "cli",
]
default-members = ["crates/rich-editor-auy"]
exclude = ["fuzz", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/st-all-one/rich-editor-auy"
homepage = "https://github.com/st-all-one/rich-editor-auy"
authors = ["st-all-one"]

[workspace.dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
unused_import_braces = "deny"
variant_size_differences = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
unused_footnote_definition = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
absolute_paths = "warn"
wildcard_imports = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
disallowed_fields = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_names = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
allow_attributes = "allow"
allow_attributes_without_reason = "deny"
large_enum_variant = "deny"
large_stack_arrays = "deny"
result_large_err = "warn"
large_types_passed_by_value = "warn"
large_stack_frames = "warn"
large_futures = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
implicit_hasher = "allow"
min_ident_chars = "allow"
many_single_char_names = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
assert_is_empty = "allow"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
overflow-checks = true
debug-assertions = true
